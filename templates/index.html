<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Adaptive MCTS Chess</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="app">
      <section class="controls">
        <h1>Adaptive MCTS Chess</h1>
        <div class="row">
          <label for="human-color">Human color</label>
          <select id="human-color">
            <option value="white">White</option>
            <option value="black">Black</option>
          </select>
        </div>
        <div class="actions">
          <button id="new-game">New game</button>
          <button id="save-log">Save log</button>
        </div>
        <p id="message" class="message">Start a new game.</p>
      </section>

      <section class="board-area">
        <div id="board-shell" class="board-shell">
          <div id="board" class="board" aria-label="Chess board"></div>
          <div id="board-alert" class="board-alert" aria-live="polite"></div>
        </div>
      </section>

      <section class="status">
        <h2>Status</h2>
        <dl>
          <div>
            <dt>Game</dt>
            <dd id="status">No game</dd>
          </div>
          <div>
            <dt>Turn</dt>
            <dd id="turn">-</dd>
          </div>
          <div>
            <dt>White role</dt>
            <dd id="white-role">-</dd>
          </div>
          <div>
            <dt>Black role</dt>
            <dd id="black-role">-</dd>
          </div>
          <div>
            <dt>Moves</dt>
            <dd id="num-moves">0</dd>
          </div>
          <div>
            <dt>Result</dt>
            <dd id="result">-</dd>
          </div>
        </dl>
        <h2>Move log</h2>
        <ol id="move-log" class="move-log"></ol>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
